name: Auto Scan & Update M3U

on:
  schedule:
    # 01:00 sáng VN (UTC+7) = 18:00 UTC ngày hôm trước
    - cron: '0 18 * * *'
    # 13:00 chiều VN (UTC+7) = 06:00 UTC cùng ngày
    - cron: '0 6 * * *'
  # Cho phép bấm chạy thủ công từ tab Actions để test
  workflow_dispatch:

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để push code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      # Chạy script cào dữ liệu (Bỏ qua bước bật server Express, chạy trực tiếp script)
      - name: Run VTVGo Scanner
        run: node scripts/update-vtvgo.js
        env:
          NODE_ENV: production

      - name: Run XemTV Scanner
        run: node scripts/update-xemtv.js
        env:
          NODE_ENV: production

      # Tự động commit và push nếu file tvPremium.m3u có thay đổi
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tvPremium.m3u
          # Chỉ commit nếu có sự thay đổi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update tvPremium.m3u [$(date +'%Y-%m-%d %H:%M')]"
            git push
          else
            echo "Không có thay đổi nào trong tvPremium.m3u, bỏ qua commit."
          fi