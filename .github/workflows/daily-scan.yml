name: Auto Scan & Update M3U

on:
  schedule:
    - cron: '0 18 * * *' # 01:00 sáng VN
    - cron: '0 6 * * *'  # 13:00 chiều VN
  workflow_dispatch:

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run VTVGo Scanner
        run: bun run scripts/update-vtvgo.js
        env:
          NODE_ENV: production

      - name: Run XemTV Scanner
        run: bun run scripts/update-xemtv.js
        env:
          NODE_ENV: production

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tvPremium.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update tvPremium.m3u [$(date +'%Y-%m-%d %H:%M')]"
            git push
          else
            echo "Không có thay đổi nào trong tvPremium.m3u, bỏ qua commit."
          fi
