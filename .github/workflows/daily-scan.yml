name: Auto Replace M3U Links

on:
  schedule:
    - cron: '0 18 * * *' # 01:00 sáng VN
    - cron: '0 6 * * *'  # 13:00 chiều VN
  workflow_dispatch:

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run Smart Replace Script
        run: bun run scripts/smart-replace.js

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tvPremium.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Auto replace m3u8 links [$(date +'%Y-%m-%d %H:%M')]"
            git push
          else
            echo "Không có link nào thay đổi, bỏ qua."
          fi