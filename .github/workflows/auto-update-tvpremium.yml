name: m3u8 Scanner Premium

on:
  schedule:
    # 01:00 AM VN = 18:00 UTC (hôm trước)
    # 13:00 PM (1h chiều) VN = 06:00 UTC
    - cron: '0 18,6 * * *'
  workflow_dispatch: # Cho phép bấm Run workflow trực tiếp trên GitHub bất cứ khi nào

# Cấp quyền ghi mã nguồn để GitHub Actions tự động commit & push
permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chạy quét VTVGo và cập nhật file tvPremium.m3u
        run: node scripts/update-vtvgo.js

      - name: Tự động commit và đẩy đè lên nhánh hiện tại
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvPremium.m3u
          if git diff --staged --quiet; then
            echo "Nội dung file tvPremium.m3u không thay đổi, bỏ qua commit."
          else
            git commit -m "Auto-update: Cập nhật luồng VTVGo mới vào tvPremium.m3u [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref }}
            echo "Đã đẩy thành công bản cập nhật tvPremium.m3u lên GitHub!"
          fi
