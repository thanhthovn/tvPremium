name: Auto Update M3U Playlist (VTVGo + XemTV)

on:
  # 1. Chạy tự động theo lịch (Cron)
  # GitHub Actions dùng giờ UTC. Việt Nam là UTC+7.
  # 01:00 VN = 18:00 UTC (ngày hôm trước)
  # 13:00 VN = 06:00 UTC
  schedule:
    - cron: '0 18 * * *' # 01:00 sáng VN
    - cron: '0 6 * * *'  # 13:00 chiều VN

  # 2. Cho phép bấm chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    # Cấp quyền cho bot được phép ghi đè file và commit
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX LỖI: Cannot read properties of null (reading 'edgesOut')
      - name: ⬆️ Upgrade npm to fix Arborist crash
        run: npm install -g npm@11.6.0

      # FIX LỖI: ERESOLVE (xung đột vite vs esbuild)
      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 🚀 CHẠY SCRAPERS
      - name: 🚀 Run Scrapers (VTVGo & XemTV)
        run: |
          echo "========================================="
          echo "🚀 Đang chạy quét VTVGo..."
          echo "========================================="
          node scripts/update-vtvgo.js || echo "⚠️ VTVGo lỗi, bỏ qua bước này."
          
          echo "========================================="
          echo "🚀 Đang chạy quét XemTV..."
          echo "========================================="
          node scripts/update-xemtv.js || echo "⚠️ XemTV lỗi, bỏ qua bước này."

      # 🔍 KIỂM TRA XEM FILE CÓ THAY ĐỔI KHÔNG
      - name: 🔍 Check for changes
        id: git-check
        run: |
          if git diff --exit-code tvPremium.m3u > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Không có thay đổi nào trong file tvPremium.m3u."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔥 Phát hiện thay đổi trong file tvPremium.m3u!"
          fi

      # 💾 COMMIT VÀ PUSH NẾU CÓ THAY ĐỔI
      - name: 💾 Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tvPremium.m3u
          
          # Lấy thời gian hiện tại theo giờ VN
          COMMIT_MSG="Auto-update tvPremium.m3u - $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S') (VN)"
          
          git commit -m "$COMMIT_MSG"
          git push

      - name: ✅ Done (No changes)
        if: steps.git-check.outputs.changed == 'false'
        run: echo "Không có thay đổi nào trong tvPremium.m3u. Bỏ qua commit."
