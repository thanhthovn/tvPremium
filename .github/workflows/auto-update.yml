name: Auto Smart Replace & Commit M3U

on:
  schedule:
    # 01:00 VN = 18:00 UTC (hôm trước)
    - cron: '0 18 * * *'
    # 13:00 VN = 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  smart-replace:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Smart Replace API
        run: |
          echo "Đang kích hoạt Smart Replace qua Server API..."
          
          # Gọi API Smart Replace của bạn
          # (Nhớ thay thế URL bên dưới bằng link server thật của bạn, ví dụ: https://app-cua-ban.onrender.com)
          
          RESPONSE=$(curl -s -X POST "https://your-server-url.com/api/smart-replace" \
            -H "Content-Type: application/json" \
            -d '{
              "token": "${{ secrets.GH_TOKEN }}",
              "repo": "thanhthovn/tvPremium",
              "branch": "main",
              "channelUrlFile": "channel_url.txt",
              "m3uFile": "tvPremium.m3u"
            }')
          
          echo "Kết quả từ Server:"
          echo "$RESPONSE"
          
          # Kiểm tra xem API trả về thành công không
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Smart Replace thành công!"
          else
            echo "❌ Smart Replace thất bại. Vui lòng kiểm tra log Server."
            exit 1
          fi
